[package]
name = "beezl"
version = "0.4.0"
edition = "2021"
description = "Seamless cursor movement between monitors of different size and resolution on Windows"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "display", "serde", "std"] }

[target.'cfg(windows)'.dependencies]
miniz_oxide = "0.8"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030"] }

[build-dependencies]
embed-resource = "3"
miniz_oxide = "0.8"
slint-build = "1.18"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[[bin]]
name = "beezl"
path = "src/main.rs"

[[bin]]
name = "beezl-ui"
path = "src/ui/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Slint's winit backend divides by the monitor refresh rate, which Windows can
# report as 0 Hz for virtual/remote displays. Patched copy until upstream fixes it.
[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
