# Manual check of the winget package: validates the manifests for a published
# release, installs beezl from them silently, then uninstalls it.
name: winget test

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release to test, e.g. 0.4.1 (empty = version in Cargo.toml)
        required: false

permissions:
  contents: read

jobs:
  winget:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # The runner's winget can be older than the manifest schema we use; it
      # then only warns about the schema header. Updating it on Windows Server
      # runners fails (no x64 package in the App Installer bundle).
      - run: winget --version
      - name: Manifests
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $version = $env:VERSION
          if (-not $version) {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          }
          ./winget/fill.ps1 -Version $version -Out "$PWD\target\winget"
          Get-ChildItem target\winget | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_ }
      - name: Validate
        shell: pwsh
        run: |
          # "Succeeded with warnings" has a non-zero exit code too, which
          # Actions would otherwise pick up from $LASTEXITCODE.
          $log = winget validate --manifest target\winget --disable-interactivity | Out-String
          Write-Host $log
          if ($log -notmatch 'Manifest validation succeeded') { exit 1 }
          exit 0
      - name: Install
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          # Output goes to files: on this elevated runner the installer starts
          # beezl as its own child (0.4.1 and older), and it would keep the
          # step's output pipe open forever.
          $p = Start-Process winget -NoNewWindow -PassThru `
            -RedirectStandardOutput install.log -RedirectStandardError install.err `
            -ArgumentList 'install --manifest target\winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity'
          $done = $p.WaitForExit(300000)
          Get-Content install.log, install.err
          if (-not $done) {
            Write-Host "winget did not finish in 5 minutes. Processes:"
            Get-CimInstance Win32_Process |
              Where-Object { $_.Name -match 'beezl|winget|schtasks|AppInstaller' } |
              Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize -Wrap
            Get-ChildItem "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime | Select-Object -Last 1 | Get-Content -Tail 60
            exit 1
          }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Get-Process beezl -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, StartTime
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\beezl'
          if (-not (Test-Path $key)) { throw "no uninstall entry after install" }
          Get-ItemProperty $key | Format-List DisplayName, DisplayVersion, InstallLocation, QuietUninstallString
          Get-ChildItem "$env:ProgramFiles\beezl"
      - name: Uninstall
        shell: pwsh
        run: |
          winget uninstall --manifest target\winget --silent --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Sleep 5
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\beezl') { throw "uninstall entry still there" }
          if (Test-Path "$env:ProgramFiles\beezl") { throw "install folder still there" }
          Write-Host "Removed cleanly"
