name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # A push to main whose Cargo.toml version has no tag yet is a release;
      # so is pushing a v* tag by hand. Signing runs only for releases, and
      # only once the SignPath variables are set in the repository.
      - name: Release check
        id: rel
        shell: pwsh
        env:
          HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          $release = "false"
          if ("${{ github.ref }}" -eq "refs/tags/$tag") { $release = "true" }
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            if (-not (git ls-remote --tags origin "refs/tags/$tag")) { $release = "true" }
          }
          $sign = if ($release -eq "true" -and "${{ vars.SIGNPATH_ORGANIZATION_ID }}" -ne "") { "true" } else { "false" }
          # A manual run on main resubmits the current release to winget.
          $resubmit = "${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.ref }}" -eq "refs/heads/main"
          $winget = if (($release -eq "true" -or $resubmit) -and $env:HAS_WINGET_TOKEN -eq "true") { "true" } else { "false" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          "sign=$sign" >> $env:GITHUB_OUTPUT
          "winget=$winget" >> $env:GITHUB_OUTPUT
          Write-Host "version $version, release $release, sign $sign, winget $winget"

      - run: cargo build --release
      - name: Stage daemon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\payload, target\installer | Out-Null
          Copy-Item target\release\beezl.exe target\payload\

      # The daemon is signed before it is embedded, so the installed
      # beezl.exe is signed too.
      - id: unsigned-daemon
        if: steps.rel.outputs.sign == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-daemon
          path: target/payload/beezl.exe
      - if: steps.rel.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-daemon.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/payload

      - name: Build setup
        shell: pwsh
        run: |
          # beezl-ui.exe with the daemon embedded is the installer.
          $env:BEEZL_PAYLOAD = "$PWD\target\payload\beezl.exe"
          cargo build --release --bin beezl-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\beezl-ui.exe target\installer\beezl-setup.exe
          # A clean Windows has no Visual C++ runtime; see .cargo/config.toml.
          foreach ($exe in 'target\payload\beezl.exe', 'target\installer\beezl-setup.exe') {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
            if ($text -match '(?i)vcruntime140') { Write-Error "$exe needs the VC++ runtime"; exit 1 }
          }

      - id: unsigned-setup
        if: steps.rel.outputs.sign == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: target/installer/beezl-setup.exe
      - if: steps.rel.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/installer

      # The release has one file to download; its checksum goes in the notes.
      - name: Checksum
        id: sum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target\installer\beezl-setup.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      # Plain .exe download from the run page, not a zip.
      - uses: actions/upload-artifact@v7
        with:
          path: target/installer/beezl-setup.exe
          archive: false
      - name: Release
        if: steps.rel.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: beezl ${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            **[Download beezl-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.rel.outputs.tag }}/beezl-setup.exe)**, run it and click Install.
            If SmartScreen says "Windows protected your PC", click **More info → Run anyway**.

            SHA-256: `${{ steps.sum.outputs.sha256 }}`

            [![Made with Slint](https://raw.githubusercontent.com/slint-ui/slint/master/logo/MadeWithSlint-logo-whitebg.png)](https://slint.dev)
          make_latest: true
          files: target/installer/beezl-setup.exe

      # The winget/ templates, filled in, go to microsoft/winget-pkgs as a PR
      # from a fork under the WINGET_TOKEN owner (classic token, public_repo).
      - name: winget
        if: steps.rel.outputs.winget == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $out = Join-Path $PWD "target\winget"
          ./winget/fill.ps1 -Version "${{ steps.rel.outputs.version }}" -Out $out
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
