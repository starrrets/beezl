name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Setup
        shell: pwsh
        run: |
          # cuursor-ui.exe with the daemon embedded is the installer.
          New-Item -ItemType Directory -Force target\payload, target\installer | Out-Null
          Copy-Item target\release\cuursor.exe target\payload\
          $env:CUURSOR_PAYLOAD = "$PWD\target\payload\cuursor.exe"
          cargo build --release --bin cuursor-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\cuursor-ui.exe target\installer\cuursor-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: cuursor-setup
          path: target/installer/cuursor-setup.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/installer/cuursor-setup.exe
